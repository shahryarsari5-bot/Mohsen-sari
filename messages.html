<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مدیریت پیام‌ها</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ================= هدر شیشه‌ای ================= -->
  <div class="header-wrapper">
    <header class="glass-header" id="mainHeader">
      <nav class="header-nav">
        <a href="index.html">خانه</a>
        <a href="messages.html" class="active">پیام‌ها</a>
        <a href="contact.html">ارتباط با ما</a>
        
        <div class="dropdown">
          <a href="#">گاوهای شیری ▾</a>
          <div class="dropdown-menu">
            <a href="calf-rearing.html">پرورش گوساله</a>
          </div>
        </div>

        <a href="courses.html">دوره‌ها / پروژه</a>
        <a href="about.html">درباره من</a>
        <a href="files.html">فایل‌های من</a>
        <a href="#" id="adminNavBtn" onclick="openLoginModal(); return false;" style="color: #4f46e5; border: 1px dashed #4f46e5;">ورود مدیر</a>
      </nav>
      <div class="header-logo">
        <a href="index.html"><img src="logo.png" alt="لوگو"></a>
      </div>
    </header>
  </div>

  <!-- ================= محتوای صفحه پیام‌ها ================= -->
  <main class="container">

    <!-- فرم ثبت پیام جدید (فقط برای مدیر) -->
    <section id="adminMessageSection" class="messages-form-card" style="display: none;">
      <h2>ارسال پیام جدید (ویژه مدیریت)</h2>
      <form id="messageForm" onsubmit="submitNewMessage(event)">
        <input type="text" id="senderName" placeholder="نام فرستنده (مثلاً: مدیر سیستم)" required>
        <textarea id="messageText" rows="4" placeholder="متن پیام خود را اینجا بنویسید..." required></textarea>
        
        <!-- گزینه ارسال به اسلایدر صفحه اصلی -->
        <div style="margin: 12px 0; display: flex; align-items: center; gap: 8px;">
          <input type="checkbox" id="sendToSliderCheck" style="width: 18px; height: 18px; cursor: pointer;">
          <label for="sendToSliderCheck" style="font-size: 0.9rem; color: #334155; cursor: pointer; font-weight: bold;">
            📌 این پیام در اسلایدر صفحه اصلی هم نشان داده شود (مهم)
          </label>
        </div>

        <button type="submit" class="btn-send-message">ثبت و ارسال پیام</button>
      </form>
    </section>

    <!-- لیست پیام‌های ثبت‌شده -->
    <section class="messages-list-section">
      <h2>لیست پیام‌های ارسال‌شده</h2>
      <div id="messagesContainer" class="messages-list">
        <!-- پیام‌ها با جاوااسکریپت بارگذاری می‌شوند -->
      </div>
    </section>

  </main>

  <!-- دکمه شناور برگشت به بالا -->
  <a href="#" class="scroll-to-top" id="scrollTopBtn" title="برگشت به بالا">
    <span>برگشت به بالا</span>
  </a>

  <!-- ================= مودال ورود مدیریت ================= -->
  <div id="loginModal" class="modal-overlay">
    <div class="modal-card">
      <h3>ورود به پنل مدیریت</h3>
      <form id="loginForm" onsubmit="event.preventDefault(); checkLogin();">
        <input type="text" id="adminUser" placeholder="نام کاربری" required autocomplete="off">
        <input type="password" id="adminPass" placeholder="کلمه عبور" required>
        <div class="modal-btn-group">
          <button type="submit" class="btn-login">ورود</button>
          <button type="button" class="btn-cancel" onclick="closeLoginModal()">انصراف</button>
        </div>
      </form>
    </div>
  </div>

  <!-- اسکریپت اصلی -->
  <script src="main.js"></script>

  <script>
    // پردازش اختصاصی ثبت پیام
    function submitNewMessage(e) {
      e.preventDefault();
      
      const senderInput = document.getElementById('senderName');
      const textInput = document.getElementById('messageText');
      const checkSlider = document.getElementById('sendToSliderCheck');

      if (!textInput.value.trim()) return;

      // ۱. اگر تابع ذخیره پیام در main.js باشد اجرا می‌شود
      if (typeof saveMessage === 'function') {
        saveMessage(e);
      } else {
        // روش جایگزین مستقیم در صورت نبود تابع در main.js
        const messages = JSON.parse(localStorage.getItem('app_messages') || '[]');
        messages.unshift({
          id: Date.now(),
          sender: senderInput.value || 'مدیر سیستم',
          text: textInput.value,
          date: new Date().toLocaleDateString('fa-IR')
        });
        localStorage.setItem('app_messages', JSON.stringify(messages));
      }

      // ۲. اضافه کردن به اسلایدر صفحه اصلی در صورت تیک زدن چک‌باکس
      if (checkSlider && checkSlider.checked && typeof addSlideToSlider === 'function') {
        addSlideToSlider({
          title: textInput.value,
          tag: 'پیام مهم'
        });
      }

      // بازنشانی فرم و به‌روزرسانی لیست
      document.getElementById('messageForm').reset();
      if (typeof renderMessages === 'function') renderMessages();
    }

    // بررسی دسترسی هنگام لود
    document.addEventListener('DOMContentLoaded', () => {
      const isAdmin = localStorage.getItem('isAdmin') === 'true';
      const formSection = document.getElementById('adminMessageSection');
      if (formSection) formSection.style.display = isAdmin ? 'block' : 'none';
      if (typeof renderMessages === 'function') renderMessages();
    });
  </script>
</body>
</html>
