<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دوره‌ها و پروژه‌ها</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- هدر شیشه‌ای کامل و هماهنگ -->
  <div class="header-wrapper" id="headerWrapper">
    <header class="glass-header" id="mainHeader">
      <nav class="header-nav">
        <a href="index.html">خانه</a>
        <a href="messages.html">پیام‌ها</a>
        <a href="contact.html">ارتباط با ما</a>
        
        <div class="dropdown">
          <a href="#">گاوهای شیری ▾</a>
          <div class="dropdown-menu">
            <a href="calf-rearing.html">پرورش گوساله</a>
          </div>
        </div>

        <a href="courses.html" class="active">دوره‌ها / پروژه</a>
        <a href="about.html">درباره من</a>
        <a href="files.html">فایل‌های من</a>
        <a href="#" id="adminNavBtn" onclick="openLoginModal()" style="color: #4f46e5; border: 1px dashed #4f46e5;">ورود مدیر</a>
      </nav>
      <div class="header-logo">
        <img src="logo.png" alt="لوگو">
      </div>
    </header>
  </div>

  <!-- محتوای اصلی -->
  <main class="container">
    <div id="notifBannerArea"></div>

    <!-- پنل ثبت جلسه و دوره جدید (مخصوص مدیر) -->
    <div class="admin-only" style="display: none; background: #ffffff; border: 1.5px dashed #0284c7; padding: 25px; border-radius: 24px; margin: 0 auto 40px auto; max-width: 1000px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);">
      <h3 style="color: #0369a1; margin-bottom: 20px; font-weight: 800; font-size: 1.1rem;">🎥 پنل ثبت دوره و جلسات جدید (مخصوص مدیر)</h3>
      
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; margin-bottom: 15px;">
        <input type="text" id="courseCategory" class="form-input" placeholder="نام دوره / فصل (مثلاً: دوره جامع جیره‌نویسی گاو شیری)" style="width: 100%; padding: 12px 16px; border: 1px solid #cbd5e1; border-radius: 14px; outline: none;">
        <input type="text" id="courseTitle" class="form-input" placeholder="عنوان این جلسه (مثلاً: جلسه اول - اصول مقدماتی)" style="width: 100%; padding: 12px 16px; border: 1px solid #cbd5e1; border-radius: 14px; outline: none;">
      </div>
      
      <label style="font-size: 0.85rem; color: #475569; font-weight: bold; display: block; margin-bottom: 8px;">روش بارگذاری ویدیو:</label>
      <div style="display: flex; gap: 12px; margin-bottom: 15px; flex-wrap: wrap; align-items: center;">
        <input type="text" id="courseVideoUrl" class="form-input" placeholder="لینک معمولی یا امبد آپارات..." style="flex: 2; min-width: 220px; padding: 12px 16px; border: 1px solid #cbd5e1; border-radius: 14px; outline: none;">
        <span style="font-size: 0.85rem; color: #64748b; font-weight: bold;">یا</span>
        <input type="file" id="localVideoFile" accept="video/*" class="form-input" style="flex: 2; min-width: 220px; padding: 10px; border: 1px dashed #0284c7; background: #f0f9ff; border-radius: 14px; cursor: pointer;">
      </div>

      <textarea id="courseDesc" class="form-input" placeholder="توضیحات مختصر درباره این جلسه..." rows="3" style="width: 100%; padding: 12px 16px; border: 1px solid #cbd5e1; border-radius: 14px; outline: none; margin-bottom: 15px; resize: vertical;"></textarea>

      <!-- گزینه استفاده از ثانیه اول ویدیو -->
      <div style="margin: 12px 0; display: flex; align-items: center; gap: 8px;">
        <input type="checkbox" id="useVideoFrameCheck" style="width: 18px; height: 18px; cursor: pointer;" checked>
        <label for="useVideoFrameCheck" style="font-size: 0.9rem; color: #334155; cursor: pointer; font-weight: bold;">
          🎬 استفاده از ثانیه اول ویدیو به‌عنوان تصویر اسلایدر
        </label>
      </div>

      <!-- چک‌باکس اضافه شده: آیا در اسلایدر صفحه اصلی نشان داده شود؟ -->
      <div style="margin: 12px 0; display: flex; align-items: center; gap: 8px;">
        <input type="checkbox" id="showInSliderCheck" style="width: 18px; height: 18px; cursor: pointer;" checked>
        <label for="showInSliderCheck" style="font-size: 0.9rem; color: #0284c7; cursor: pointer; font-weight: bold;">
          🌟 این دوره در اسلایدر صفحه اصلی (خانه) نشان داده شود
        </label>
      </div>

      <button onclick="createNewCourse()" class="btn-download" style="width: 100%; margin-top: 10px; padding: 14px; font-size: 1rem;">انتشار این جلسه</button>
    </div>

    <!-- عنوان و توضیحات -->
    <div style="margin-top: 10px; margin-bottom: 25px; max-width: 1000px; margin-right: auto; margin-left: auto;">
      <h2 class="section-title" style="margin-bottom: 12px; text-align: right;">دوره‌ها و پروژه‌های آموزشی</h2>
      <p style="color: #64748b; font-size: 0.9rem; text-align: right;">برای مشاهده جلسات هر دوره، روی عنوان دوره کلیک کنید:</p>
    </div>
    
    <!-- لیست آکاردئونی دوره‌ها -->
    <div id="coursesAccordionList" style="max-width: 1000px; margin: 0 auto;"></div>
  </main>

  <!-- پنجره لاگین مدیر -->
  <div id="loginModal" class="modal-overlay">
    <div class="modal-card">
      <h3 style="margin-bottom: 15px; color: #0f172a;">ورود به پنل مدیریت</h3>
      <input type="text" id="adminUser" class="form-input" placeholder="نام کاربری (admin)">
      <input type="password" id="adminPass" class="form-input" placeholder="رمز عبور (admin123)">
      <button onclick="checkLogin()" class="btn-login" style="width: 100%; margin-top: 10px;">ورود</button>
      <button onclick="closeLoginModal()" style="background: none; border: none; width: 100%; margin-top: 10px; color: #64748b; cursor: pointer;">انصراف</button>
    </div>
  </div>

  <a href="#" class="scroll-to-top" id="scrollTopBtn">
    <span>برگشت به بالا</span>
  </a>

  <!-- لینک به فایل JS اصلی -->
  <script src="main.js"></script>
  <script>
    // انیمیشن کوچک شدن هدر موقع اسکرول
    window.addEventListener('scroll', () => {
      const headerWrapper = document.getElementById('headerWrapper');
      if (window.scrollY > 40) {
        headerWrapper.classList.add('scrolled');
      } else {
        headerWrapper.classList.remove('scrolled');
      }
    });
  </script>
</body>
</html>
